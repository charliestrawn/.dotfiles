unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"

set -g mouse on
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g allow-passthrough on

set -g prefix C-space
set -g base-index 1
set -g detach-on-destroy off
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
set -s escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g extended-keys on

# create a new named session
bind-key N command-prompt -p "New session name:" "new-session -s '%%'"

# create splits
bind-key | split-window -h
bind-key - split-window -v

# navigate splits
bind-key -n C-h if -F "#{pane_at_left}"   "" "select-pane -L"
bind-key -n C-j if -F "#{pane_at_bottom}" "" "select-pane -D"
bind-key -n C-k if -F "#{pane_at_top}"    "" "select-pane -U"
bind-key -n C-l if -F "#{pane_at_right}"  "" "select-pane -R"

# dont break moving commits in lazygit
bind-key -n C-j if-shell "[ #{pane_current_command} = lazygit ]" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "[ #{pane_current_command} = lazygit ]" "send-keys C-k"  "select-pane -U"

# Vi copypaste mode
set -g mode-keys vi
bind-key -T copy-mode-vi 'Escape' send -X cancel
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection

# plugins
set-env -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'janoamaral/tokyo-night-tmux'
set -g @tokyo-night-tmux_window_id_style none
set -g @tokyo-night-tmux_transparent 1
set -g @tokyo-night-tmux_show_datetime 1

