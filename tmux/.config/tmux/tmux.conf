run 'tpack init'

setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{==:#{pane_current_path},$HOME},~,#{b:pane_current_path}}#{?#{m:*sh,#{pane_current_command}},, | #{pane_current_command}}"

