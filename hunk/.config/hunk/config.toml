theme = "github-dark-high-contrast"
mode = "stack"
vcs = "git"                         # git, jj, sl
watch = false
exclude_untracked = false
line_numbers = true
tab_width = 4                       # tab stops, 1-16
wrap_lines = false
menu_bar = false
sidebar = false                     # "auto", true, false
agent_notes = false
prompt_save_view_preferences = true
transparent_background = true
hunk_headers = true
copy_decorations = false
cursor_line = "row"
