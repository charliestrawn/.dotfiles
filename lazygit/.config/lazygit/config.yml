git:
  overrideGpg: true
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
      name: delta
    - type: rawGit
      args: [--color-words]
      name: color-words
    - type: rawGit # git's default diff
      name: default
gui:
  nerdFontsVersion: "3"
  animateExplosion: true
customCommands:
  - key: "o"
    context: "worktrees"
    description: "Open worktree in a new Herdr split pane"
    command: 'herdr pane split --current --direction right --cwd "{{.SelectedWorktree.Path}}" --focus'
    loadingText: "Opening pane..."
